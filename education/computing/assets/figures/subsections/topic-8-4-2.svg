<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Encoding and syndrome extraction</title><desc id="desc">Two CNOTs spread one qubit over three. After a possible error E, four CNOTs write two parities onto fresh qubits, and only those are measured. Every branch of the encoded state has the same parities, so the measurement locates a single flip without revealing a or b. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Encoding and syndrome extraction</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="a\ket0+b\ket1">a|0⟩+b|1⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 250L810 250"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="325" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 320L720.0 320"/><path class="wire" d="M720.0 317L810 317"/><path class="wire" d="M720.0 323L810 323"/><text x="830" y="325" text-anchor="start" class="" data-max-width="120" data-tex="x_1\oplus x_2">x₁⊕ x₂</text><text x="150" y="395" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 390L720.0 390"/><path class="wire" d="M720.0 387L810 387"/><path class="wire" d="M720.0 393L810 393"/><text x="830" y="395" text-anchor="start" class="" data-max-width="120" data-tex="x_2\oplus x_3">x₂⊕ x₃</text><path class="wire" d="M240.0 110L240.0 180"/><circle cx="240.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="240.0" cy="180" r="14"/><path class="wire" d="M226.0 180L254.0 180"/><path class="wire" d="M240.0 166L240.0 194"/><path class="wire" d="M308.57142857142856 110L308.57142857142856 250"/><circle cx="308.57142857142856" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="308.57142857142856" cy="250" r="14"/><path class="wire" d="M294.57142857142856 250L322.57142857142856 250"/><path class="wire" d="M308.57142857142856 236L308.57142857142856 264"/><rect class="gate" x="350.2678571428571" y="90" width="53.75" height="180" rx="3"/><text x="377.143" y="186" text-anchor="middle" class="" data-max-width="45.75" data-tex="E">E</text><path class="wire" d="M445.7142857142857 110L445.7142857142857 320"/><circle cx="445.7142857142857" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="445.7142857142857" cy="320" r="14"/><path class="wire" d="M431.7142857142857 320L459.7142857142857 320"/><path class="wire" d="M445.7142857142857 306L445.7142857142857 334"/><path class="wire" d="M514.2857142857142 180L514.2857142857142 320"/><circle cx="514.2857142857142" cy="180" r="5" fill="#476b70"/><circle class="gate" cx="514.2857142857142" cy="320" r="14"/><path class="wire" d="M500.2857142857142 320L528.2857142857142 320"/><path class="wire" d="M514.2857142857142 306L514.2857142857142 334"/><path class="wire" d="M582.8571428571429 180L582.8571428571429 390"/><circle cx="582.8571428571429" cy="180" r="5" fill="#476b70"/><circle class="gate" cx="582.8571428571429" cy="390" r="14"/><path class="wire" d="M568.8571428571429 390L596.8571428571429 390"/><path class="wire" d="M582.8571428571429 376L582.8571428571429 404"/><path class="wire" d="M651.4285714285714 250L651.4285714285714 390"/><circle cx="651.4285714285714" cy="250" r="5" fill="#476b70"/><circle class="gate" cx="651.4285714285714" cy="390" r="14"/><path class="wire" d="M637.4285714285714 390L665.4285714285714 390"/><path class="wire" d="M651.4285714285714 376L651.4285714285714 404"/><rect class="gate" x="693.125" y="300" width="53.75" height="40" rx="3"/><text x="720" y="326" text-anchor="middle" class="" data-max-width="45.75">M</text><rect class="gate" x="693.125" y="370" width="53.75" height="40" rx="3"/><text x="720" y="396" text-anchor="middle" class="" data-max-width="45.75">M</text><text x="480" y="442" text-anchor="middle" class="small" data-max-width="880" data-math="Syndrome: \((x_1\oplus x_2,\;x_2\oplus x_3)\)">Syndrome: (x₁⊕ x₂, x₂⊕ x₃)</text></svg>
