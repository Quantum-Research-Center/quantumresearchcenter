<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" role="img" aria-labelledby="title desc"><title id="title">The reflection seen in a plane</title><desc id="desc">Left: the mirror line is |s⟩. The component along the mirror passes through unchanged, the perpendicular component reverses, and a state at angle θ lands at −θ. Right: on two qubits |00⟩ overlaps |s⟩ by 1/2, which puts it 60° from the mirror, and D sends it to |s⟩−|00⟩, taking the amplitudes (1/2,1/2,1/2,1/2) to (−1/2,1/2,1/2,1/2). Any state in the plane: the state is mirrored from 55 degrees to minus 55 degrees. Two qubits, |00⟩: the state is mirrored from 60 degrees to minus 60 degrees.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The reflection seen in a plane</text><text x="190" y="70" text-anchor="middle" class="heading" data-max-width="320">Any state in the plane</text><path d="M32 252L352 252" class="edge" style="stroke:#a7bccd"/><path d="M190 396L190 94" class="edge" style="stroke:#a7bccd"/><text x="356" y="257" text-anchor="start" class="small" data-max-width="90" data-tex="\ket s">|s⟩</text><text x="202" y="90" text-anchor="start" class="small" data-max-width="110" data-tex="\ket{s_\perp}">|s_⊥⟩</text><path d="M190 252H255.388" stroke="#246593" stroke-width="6" stroke-opacity=".5"/><path d="M255.388 158.617V345.383" fill="none" stroke="#a7bccd" stroke-dasharray="4 4"/><path d="M190 252L255.388 158.617" class="edge" style="stroke:#246593"/><path d="M190 252L255.388 345.383" class="edge" style="stroke:#a64d26"/><circle cx="255.388" cy="158.617" r="4" fill="#246593"/><circle cx="255.388" cy="345.383" r="4" fill="#a64d26"/><path d="M242 252A52 52 0 0 0 219.826 209.404" fill="none" stroke="#8a97a3" stroke-width="1.4"/><text x="250.317" y="225.601" text-anchor="middle" class="small" data-max-width="30" data-tex="\theta">θ</text><path d="M242 252A52 52 0 0 1 219.826 294.596" fill="none" stroke="#8a97a3" stroke-width="1.4"/><text x="250.317" y="288.399" text-anchor="middle" class="small" data-max-width="30" data-tex="\theta">θ</text><text x="271.448" y="140.68" text-anchor="middle" class="small" data-max-width="80" data-tex="\ket x">|x⟩</text><text x="271.448" y="373.32" text-anchor="middle" class="small" data-max-width="90" data-tex="D\ket x">D|x⟩</text><text x="190" y="421" text-anchor="middle" class="small" data-max-width="305" data-math="The part along \(\ket s\) is kept; the">The part along |s⟩ is kept; the</text><text x="190" y="443" text-anchor="middle" class="small" data-max-width="305">perpendicular part is negated.</text><text x="570" y="70" text-anchor="middle" class="heading" data-max-width="320" data-math="Two qubits, \(\ket{00}\)">Two qubits, |00⟩</text><path d="M412 252L732 252" class="edge" style="stroke:#a7bccd"/><path d="M570 396L570 94" class="edge" style="stroke:#a7bccd"/><text x="736" y="257" text-anchor="start" class="small" data-max-width="90" data-tex="\ket s">|s⟩</text><text x="582" y="90" text-anchor="start" class="small" data-max-width="110" data-tex="\ket{s_\perp}">|s_⊥⟩</text><path d="M570 252H627" stroke="#246593" stroke-width="6" stroke-opacity=".5"/><path d="M627 153.273V350.727" fill="none" stroke="#a7bccd" stroke-dasharray="4 4"/><path d="M570 252L627 153.273" class="edge" style="stroke:#246593"/><path d="M570 252L627 350.727" class="edge" style="stroke:#a64d26"/><circle cx="627" cy="153.273" r="4" fill="#246593"/><circle cx="627" cy="350.727" r="4" fill="#a64d26"/><path d="M622 252A52 52 0 0 0 596 206.967" fill="none" stroke="#8a97a3" stroke-width="1.4"/><text x="628.89" y="223" text-anchor="middle" class="small" data-max-width="30" data-tex="\theta">θ</text><path d="M622 252A52 52 0 0 1 596 297.033" fill="none" stroke="#8a97a3" stroke-width="1.4"/><text x="628.89" y="291" text-anchor="middle" class="small" data-max-width="30" data-tex="\theta">θ</text><text x="641" y="134.024" text-anchor="middle" class="small" data-max-width="80" data-tex="\ket{00}">|00⟩</text><text x="641" y="379.976" text-anchor="middle" class="small" data-max-width="90" data-tex="D\ket{00}">D|00⟩</text><text x="598.5" y="272" text-anchor="middle" class="small" data-max-width="60" data-tex="\tfrac12">1/2</text><text x="637" y="207.637" text-anchor="start" class="small" data-max-width="60" data-tex="\tfrac{\sqrt3}{2}">√3/2</text><text x="570" y="421" text-anchor="middle" class="small" data-max-width="305" data-math="\(D\ket{00}=\ket s-\ket{00}\), so the \(\ket{00}\)">D|00⟩=|s⟩−|00⟩, so the |00⟩</text><text x="570" y="443" text-anchor="middle" class="small" data-max-width="305" data-math="amplitude changes from \(\tfrac12\) to \(-\tfrac12\).">amplitude changes from 1/2 to −1/2.</text></svg>
