<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Two controls from one</title><desc id="desc">The controlled-V† acts while the middle wire holds a⊕ b. The powers of V applied to the target add to 2ab, so the target undergoes U=V² exactly when both controls are one. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Two controls from one</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket t">|t⟩</text><path class="wire" d="M170 250L810 250"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 180L240.0 250"/><circle cx="240.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="210.0" y="230" width="60" height="40" rx="3"/><text x="240" y="256" text-anchor="middle" class="" data-max-width="52" data-tex="V">V</text><path class="wire" d="M360.0 110L360.0 180"/><circle cx="360.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="360.0" cy="180" r="14"/><path class="wire" d="M346.0 180L374.0 180"/><path class="wire" d="M360.0 166L360.0 194"/><path class="wire" d="M480.0 180L480.0 250"/><circle cx="480.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="450.0" y="230" width="60" height="40" rx="3"/><text x="480" y="256" text-anchor="middle" class="" data-max-width="52" data-tex="V^\dagger">V†</text><path class="wire" d="M600.0 110L600.0 180"/><circle cx="600.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="600.0" cy="180" r="14"/><path class="wire" d="M586.0 180L614.0 180"/><path class="wire" d="M600.0 166L600.0 194"/><path class="wire" d="M720.0 110L720.0 250"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><rect class="gate" x="690.0" y="230" width="60" height="40" rx="3"/><text x="720" y="256" text-anchor="middle" class="" data-max-width="52" data-tex="V">V</text><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880" data-math="The target undergoes \(V^{\,b-(a\oplus b)+a}=V^{2ab}=U^{ab}\)">The target undergoes V^( b−(a⊕ b)+a)=V^(2ab)=U^(ab)</text></svg>
