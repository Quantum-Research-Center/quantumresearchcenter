<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">A controlled phase from CNOTs and phase gates</title><desc id="desc">The middle phase gate acts while the second wire holds a⊕ b. The three phases add to φ ab, so only |11⟩ acquires e^(iφ), and the second CNOT restores b. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">A controlled phase from CNOTs and phase gates</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="R_{\phi/2}">R_(φ/2)</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="R_{\phi/2}">R_(φ/2)</text><path class="wire" d="M400.0 110L400.0 180"/><circle cx="400.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="400.0" cy="180" r="14"/><path class="wire" d="M386.0 180L414.0 180"/><path class="wire" d="M400.0 166L400.0 194"/><rect class="gate" x="510.0" y="160" width="100" height="40" rx="3"/><text x="560" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="R_{-\phi/2}">R_(−φ/2)</text><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="180" r="14"/><path class="wire" d="M706.0 180L734.0 180"/><path class="wire" d="M720.0 166L720.0 194"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Total phase: \(\tfrac\phi2\bigl(a+b-(a\oplus b)\bigr)=\phi\,ab\)">Total phase: φ/2bigl(a+b−(a⊕ b)bigr)=φ ab</text></svg>
