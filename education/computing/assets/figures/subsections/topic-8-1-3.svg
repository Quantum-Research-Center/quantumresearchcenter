<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Marking the string 01</title><desc id="desc">The X on the first wire maps 01 to 11, the only string that controlled-Z changes, and then maps it back. Every other string leaves and returns without a sign. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Marking the string 01</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_1}">|x₁⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_2}">|x₂⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="110" r="5" fill="#476b70"/><circle cx="480.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \((-1)^{m_{01}(x)}\ket{x_1}\ket{x_2}\)">Output: (−1)^(m₀₁(x))|x₁⟩|x₂⟩</text></svg>
