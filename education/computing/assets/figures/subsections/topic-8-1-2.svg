<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" aria-labelledby="title desc"><title id="title">Hadamards turn a flip into a sign</title><desc id="desc">When the control is 1, the target of the first circuit undergoes HXH=Z, so both circuits multiply |a⟩|b⟩ by (−1)^(ab). Controlled-Z is drawn with two dots because neither qubit is singled out as its control. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Hadamards turn a flip into a sign</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">CNOT between Hadamards on the target</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="H">H</text><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="480.0" cy="180" r="14"/><path class="wire" d="M466.0 180L494.0 180"/><path class="wire" d="M480.0 166L480.0 194"/><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="H">H</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \((-1)^{ab}\ket a\ket b\)">Output: (−1)^(ab)|a⟩|b⟩</text><text x="480" y="357" text-anchor="middle" class="small" data-max-width="700" data-math="Controlled-\(Z\)">Controlled-Z</text><text x="150" y="403" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 398L810 398"/><text x="830" y="403" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="473" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 468L810 468"/><text x="830" y="473" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M480 398L480 468"/><circle cx="480" cy="398" r="5" fill="#476b70"/><circle cx="480" cy="468" r="5" fill="#476b70"/><text x="480" y="520" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \((-1)^{ab}\ket a\ket b\)">Output: (−1)^(ab)|a⟩|b⟩</text></svg>
