<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" aria-labelledby="title desc"><title id="title">Moving X through a CNOT</title><desc id="desc">Both circuits send |a⟩|b⟩ to |a⊕1⟩|a⊕ b⊕1⟩. An X on the control before a CNOT equals X on both wires after it, so in a longer circuit the X can be moved past the CNOT and cancelled against a matching gate. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Moving X through a CNOT</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">X on the control, then CNOT</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="180" r="14"/><path class="wire" d="M706.0 180L734.0 180"/><path class="wire" d="M720.0 166L720.0 194"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \(\ket{a\oplus1}\ket{a\oplus b\oplus1}\)">Output: |a⊕1⟩|a⊕ b⊕1⟩</text><text x="480" y="357" text-anchor="middle" class="small" data-max-width="700">CNOT, then X on both wires</text><text x="150" y="403" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 398L810 398"/><text x="830" y="403" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="473" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 468L810 468"/><text x="830" y="473" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 398L240.0 468"/><circle cx="240.0" cy="398" r="5" fill="#476b70"/><circle class="gate" cx="240.0" cy="468" r="14"/><path class="wire" d="M226.0 468L254.0 468"/><path class="wire" d="M240.0 454L240.0 482"/><rect class="gate" x="670.0" y="378" width="100" height="40" rx="3"/><text x="720" y="404" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><rect class="gate" x="670.0" y="448" width="100" height="40" rx="3"/><text x="720" y="474" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><text x="480" y="520" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \(\ket{a\oplus1}\ket{a\oplus b\oplus1}\)">Output: |a⊕1⟩|a⊕ b⊕1⟩</text></svg>
