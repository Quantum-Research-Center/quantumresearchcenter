<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Two two-level pieces of H on one qubit</title><desc id="desc">The first controlled-H, whose control is masked by X, mixes only 00 and 10; the second mixes only 01 and 11. Each is a two-level unitary, and together they apply H to the first qubit whatever the second holds. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Two two-level pieces of H on one qubit</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_1}">|x₁⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_2}">|x₂⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><path class="wire" d="M400.0 110L400.0 180"/><circle cx="400.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="370.0" y="90" width="60" height="40" rx="3"/><text x="400" y="116" text-anchor="middle" class="" data-max-width="52" data-tex="H">H</text><rect class="gate" x="510.0" y="160" width="100" height="40" rx="3"/><text x="560" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="X">X</text><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="690.0" y="90" width="60" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="52" data-tex="H">H</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Equals \(H\otimes I\)">Equals H⊗ I</text></svg>
