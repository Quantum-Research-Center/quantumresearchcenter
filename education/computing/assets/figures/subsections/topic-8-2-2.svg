<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Controlled-U by conjugation</title><desc id="desc">W† carries the eigenvectors of U to |0⟩ and |1⟩, where the controlled operation is a controlled phase; W carries them back. R_α on the control supplies the phase e^(iα) on the control-1 branch. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Controlled-U by conjugation</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket c">|c⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket t">|t⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="R_\alpha">R_α</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="W^\dagger">W†</text><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="110" r="5" fill="#476b70"/><rect class="gate" x="440.0" y="160" width="80" height="40" rx="3"/><text x="480" y="186" text-anchor="middle" class="" data-max-width="72" data-tex="R_{\beta-\alpha}">R_(β−α)</text><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="W">W</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Equals controlled-\(U\), where \(U=W\operatorname{diag}(e^{i\alpha},e^{i\beta})W^\dagger\)">Equals controlled-U, where U=Wdiag(e^(iα),e^(iβ))W†</text></svg>
