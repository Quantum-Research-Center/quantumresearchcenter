<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg"><circle cx="190" cy="150" r="115" class="fig-box"/><ellipse cx="190" cy="150" rx="115" ry="36.8" class="fig-grid"/><path d="M190.0,35.0 L190.0,265.0" class="fig-line-1"></path><circle cx="190.0" cy="35.0" r="5" class="fig-fill-1"/><text x="198.0" y="24.0" class="fig-label" text-anchor="middle" data-tex="\ket{0}">|0⟩</text><circle cx="190.0" cy="265.0" r="5" class="fig-fill-1"/><text x="198.0" y="286.0" class="fig-label" text-anchor="middle" data-tex="\ket{1}">|1⟩</text><path d="M126.8,198.3 L253.2,101.7" class="fig-line-2"></path><circle cx="126.8" cy="198.3" r="5" class="fig-fill-1"/><text x="118.0" y="210.0" class="fig-label" text-anchor="middle" data-tex="\ket{+}">|+⟩</text><circle cx="253.2" cy="101.7" r="5" class="fig-fill-1"/><text x="262.1" y="100.0" class="fig-label" text-anchor="middle" data-tex="\ket{-}">|−⟩</text><path d="M305.0,150.0 L75.0,150.0" class="fig-measure"></path><circle cx="305.0" cy="150.0" r="5" class="fig-fill-1"/><text x="321.0" y="155.0" class="fig-label" text-anchor="middle" data-tex="\ket{+i}">|+i⟩</text><circle cx="75.0" cy="150.0" r="5" class="fig-fill-1"/><text x="59.0" y="155.0" class="fig-label" text-anchor="middle" data-tex="\ket{-i}">|−i⟩</text><text x="360.0" y="70.0" class="fig-label" text-anchor="start">Three bases, one per axis.</text><text x="360.0" y="96.0" class="fig-text" text-anchor="start">States on one axis are orthogonal;</text><text x="360.0" y="116.0" class="fig-text" text-anchor="start">states on different axes overlap</text><text x="360.0" y="136.0" class="fig-text" text-anchor="start" data-tex="\text{with probability exactly } \tfrac12.">with probability exactly 1/2.</text><text x="360.0" y="176.0" class="fig-text" text-anchor="start">A qubit has room for exactly</text><text x="360.0" y="196.0" class="fig-text" text-anchor="start" data-tex="d+1=3 \text{ such bases.}">d + 1 = 3 such bases.</text></svg>
