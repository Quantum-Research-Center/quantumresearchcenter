<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" role="img" aria-labelledby="teleport-setup-title teleport-setup-desc">
  <title id="teleport-setup-title">Initial Configuration and Purpose of Quantum Teleportation</title>
  <desc id="teleport-setup-desc">Alice holds an unknown general state |ψ⟩ and one qubit of an entangled Bell pair. Bob holds the other entangled Bell qubit and a target qubit initialized to |0⟩. Alice's purpose is to teleport |ψ⟩ to Bob's target qubit.</desc>

  <defs>
    <marker id="teleport-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect x="6" y="6" width="948" height="468" rx="14" fill="#fcfdfd" stroke="#d8e5e8" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="480" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1a3b47">Initial Setup: Preparing to Teleport an Unknown Qubit</text>
  <text x="480" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#54717a">Alice holds an unknown qubit and a shared Bell qubit; Bob holds the entangled partner and a target qubit in |0⟩.</text>

  <!-- ==================== ALICE'S LAB (LEFT) ==================== -->
  <g id="alice-station" filter="url(#soft-shadow)">
    <rect x="24" y="68" width="404" height="394" rx="12" fill="#f3f8f9" stroke="#b5d7de" stroke-width="1.5"/>
    
    <!-- Alice Header Card -->
    <rect x="36" y="78" width="380" height="74" rx="8" fill="#ffffff" stroke="#cce3e7" stroke-width="1"/>
    <circle cx="75" cy="115" r="28" fill="#e0f2f5" stroke="#0e7490" stroke-width="1.5"/>
    <svg x="51" y="91" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="17" r="8" fill="#0e7490"/>
      <path d="M14 19 C14 9, 34 9, 34 19 C34 14, 29 12, 24 12 C19 12, 14 14, 14 19 Z" fill="#0e7490"/>
      <path d="M9 41 C9 31, 16 27, 24 27 C32 27, 39 31, 39 41 Z" fill="#0e7490"/>
      <text x="24" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff">A</text>
    </svg>
    <text x="116" y="106" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#0e7490">Alice’s Laboratory</text>
    <text x="116" y="123" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#476b70">Transmitter · Station A</text>
    <text x="116" y="140" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Holds input state |ψ⟩ &amp; Bell qubit A</text>

    <!-- Alice Qubit 1: General State |ψ⟩ -->
    <g id="alice-qubit-psi">
      <rect x="36" y="162" width="380" height="102" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <circle cx="78" cy="213" r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <ellipse cx="78" cy="213" rx="36" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="78" y="219" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#0369a1" data-tex="\ket\psi">|ψ⟩</text>
      
      <text x="118" y="186" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0369a1">Qubit 1: Unknown General State</text>
      <text x="118" y="209" font-family="Georgia,serif" font-size="15" fill="#0f172a" data-tex="\ket{\psi} = \alpha\ket{0} + \beta\ket{1}">|ψ⟩ = α|0⟩ + β|1⟩</text>
      <text x="118" y="231" font-family="Arial,sans-serif" font-size="11" fill="#475569">Amplitudes α, β are completely unknown to Alice</text>
      <rect x="118" y="238" width="240" height="18" rx="4" fill="#e0f2fe"/>
      <text x="123" y="251" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#0284c7">STATE TO BE TELEPORTED TO BOB</text>
    </g>

    <!-- Alice Qubit 2: Shared Bell Qubit A -->
    <g id="alice-qubit-bell">
      <rect x="36" y="274" width="380" height="102" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
      <circle cx="78" cy="325" r="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <ellipse cx="78" cy="325" rx="36" ry="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="78" y="331" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#6d28d9" data-tex="A">A</text>
      
      <text x="118" y="298" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">Qubit 2: Shared Bell Qubit (A)</text>
      <text x="118" y="321" font-family="Georgia,serif" font-size="14" fill="#0f172a" data-tex="\text{Qubit } A \in \ket{\Phi^+}_{AB}">Qubit A ∈ |Φ⁺⟩_AB</text>
      <text x="118" y="343" font-family="Arial,sans-serif" font-size="11" fill="#475569">Maximally entangled with Bob's Qubit B</text>
      <rect x="118" y="350" width="240" height="18" rx="4" fill="#ede9fe"/>
      <text x="123" y="363" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">PRE-SHARED ENTANGLED RESOURCE</text>
    </g>

    <!-- Alice Action Summary -->
    <rect x="36" y="386" width="380" height="66" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="46" y="404" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#0e7490">Alice's Protocol Operations:</text>
    <text x="46" y="422" font-family="Arial,sans-serif" font-size="10.5" fill="#155e75">1. Couples Qubit 1 and Qubit 2 with CNOT and Hadamard gates.</text>
    <text x="46" y="439" font-family="Arial,sans-serif" font-size="10.5" fill="#155e75">2. Measures both qubits, destroying local copy &amp; yielding 2 bits (m, n).</text>
  </g>

  <!-- ==================== BOB'S LAB (RIGHT) ==================== -->
  <g id="bob-station" filter="url(#soft-shadow)">
    <rect x="532" y="68" width="404" height="394" rx="12" fill="#fbf8f4" stroke="#ded4c3" stroke-width="1.5"/>
    
    <!-- Bob Header Card -->
    <rect x="544" y="78" width="380" height="74" rx="8" fill="#ffffff" stroke="#e7dcce" stroke-width="1"/>
    <circle cx="583" cy="115" r="28" fill="#f5eee4" stroke="#854d0e" stroke-width="1.5"/>
    <svg x="559" y="91" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="17" r="8" fill="#2563eb"/>
      <path d="M16 14 C16 8, 32 8, 32 14 Z" fill="#2563eb"/>
      <path d="M9 41 C9 31, 16 27, 24 27 C32 27, 39 31, 39 41 Z" fill="#2563eb"/>
      <text x="24" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff">B</text>
    </svg>
    <text x="624" y="106" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#854d0e">Bob’s Laboratory</text>
    <text x="624" y="123" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#785324">Receiver · Station B</text>
    <text x="624" y="140" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Holds target qubit |0⟩ &amp; Bell qubit B</text>

    <!-- Bob Qubit 1: Target Qubit |0⟩ -->
    <g id="bob-qubit-target">
      <rect x="544" y="162" width="380" height="102" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
      <circle cx="586" cy="213" r="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <ellipse cx="586" cy="213" rx="36" ry="12" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="586" y="219" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#15803d" data-tex="\ket0">|0⟩</text>
      
      <text x="626" y="186" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#15803d">Target Qubit (Station B)</text>
      <text x="626" y="209" font-family="Georgia,serif" font-size="14" fill="#0f172a" data-tex="\text{Initial: } \ket{0} \;\longrightarrow\; \text{Final: } \ket{\psi}">Initial: |0⟩ ⟶ Final: |ψ⟩</text>
      <text x="626" y="231" font-family="Arial,sans-serif" font-size="11" fill="#475569">Local destination particle ready to receive |ψ⟩</text>
      <rect x="626" y="238" width="240" height="18" rx="4" fill="#dcfce7"/>
      <text x="631" y="251" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#15803d">DESTINATION OF TELEPORTED STATE</text>
    </g>

    <!-- Bob Qubit 2: Shared Bell Qubit B -->
    <g id="bob-qubit-bell">
      <rect x="544" y="274" width="380" height="102" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
      <circle cx="586" cy="325" r="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <ellipse cx="586" cy="325" rx="36" ry="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="586" y="331" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#6d28d9" data-tex="B">B</text>
      
      <text x="626" y="298" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">Qubit 3: Shared Bell Qubit (B)</text>
      <text x="626" y="321" font-family="Georgia,serif" font-size="14" fill="#0f172a" data-tex="\text{Qubit } B \in \ket{\Phi^+}_{AB}">Qubit B ∈ |Φ⁺⟩_AB</text>
      <text x="626" y="343" font-family="Arial,sans-serif" font-size="11" fill="#475569">Remains maximally mixed until message arrives</text>
      <rect x="626" y="350" width="280" height="18" rx="4" fill="#ede9fe"/>
      <text x="631" y="363" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">COLLAPSES CONDITIONALLY TO Xⁿ Zᵐ |ψ⟩</text>
    </g>

    <!-- Bob Action Summary -->
    <rect x="544" y="386" width="380" height="66" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="554" y="404" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#854d0e">Bob's Protocol Operations:</text>
    <text x="554" y="422" font-family="Arial,sans-serif" font-size="10.5" fill="#713f12">1. Awaits 2 classical bits (m, n) from Alice over classical channel.</text>
    <text x="554" y="439" font-family="Arial,sans-serif" font-size="10.5" fill="#713f12">2. Applies Pauli correction Xⁿ then Zᵐ to restore exact state |ψ⟩.</text>
  </g>

  <!-- ==================== CENTER REGION: PURPOSE & CHANNELS ==================== -->
  
  <!-- Purpose Trajectory Arc (Top/Middle) -->
  <g id="purpose-arc">
    <path d="M 416 200 C 445 152, 515 152, 544 200" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#teleport-arrow)">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Central Purpose Badge -->
    <rect x="418" y="116" width="124" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="480" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e40af">ALICE'S PURPOSE</text>
    <text x="480" y="149" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#2563eb" data-tex="\ket{\psi} \to \text{Bob}">|ψ⟩ ⟶ Bob</text>
    <text x="480" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#3b82f6">Deliver state |ψ⟩</text>
  </g>

  <!-- Classical Channel (Middle) -->
  <g id="classical-channel">
    <line x1="428" y1="252" x2="532" y2="252" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="436" y="240" width="88" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="480" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#475569">Classical: 2 bits</text>
    <text x="480" y="261" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#64748b">(speed ≤ c)</text>
  </g>

  <!-- Entangled Link (Bottom) -->
  <g id="entangled-link">
    <!-- Entangled Strand Wave 1 -->
    <path d="M 416 325 C 440 305, 455 345, 480 325 C 505 305, 520 345, 544 325" fill="none" stroke="#7c3aed" stroke-width="2.5">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <!-- Entangled Strand Wave 2 (opposite phase) -->
    <path d="M 416 325 C 440 345, 455 305, 480 325 C 505 345, 520 305, 544 325" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Central Entanglement Badge -->
    <rect x="434" y="338" width="92" height="34" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="480" y="353" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#6d28d9" data-tex="\ket{\Phi^+}">|Φ⁺⟩</text>
    <text x="480" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#7c3aed">Entangled Link</text>
  </g>

</svg>