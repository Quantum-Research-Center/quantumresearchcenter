<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Reflection about the uniform state on two qubits</title><desc id="desc">The middle three gates negate |00⟩ alone, which is −R₀. The Hadamard layers on either side conjugate it into −D. The overall sign changes no probability unless the reflection is itself controlled. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Reflection about the uniform state on two qubits</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_1}">|x₁⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket{x_2}">|x₂⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="197.0" y="90" width="86.0" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="78.0" data-tex="H">H</text><rect class="gate" x="197.0" y="160" width="86.0" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="78.0" data-tex="H">H</text><rect class="gate" x="317.0" y="90" width="86.0" height="40" rx="3"/><text x="360" y="116" text-anchor="middle" class="" data-max-width="78.0" data-tex="X">X</text><rect class="gate" x="317.0" y="160" width="86.0" height="40" rx="3"/><text x="360" y="186" text-anchor="middle" class="" data-max-width="78.0" data-tex="X">X</text><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="110" r="5" fill="#476b70"/><circle cx="480.0" cy="180" r="5" fill="#476b70"/><rect class="gate" x="557.0" y="90" width="86.0" height="40" rx="3"/><text x="600" y="116" text-anchor="middle" class="" data-max-width="78.0" data-tex="X">X</text><rect class="gate" x="557.0" y="160" width="86.0" height="40" rx="3"/><text x="600" y="186" text-anchor="middle" class="" data-max-width="78.0" data-tex="X">X</text><rect class="gate" x="677.0" y="90" width="86.0" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="78.0" data-tex="H">H</text><rect class="gate" x="677.0" y="160" width="86.0" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="78.0" data-tex="H">H</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Implements \(-D=-(2\ket s\bra s-I)\)">Implements −D=−(2|s⟩⟨s|−I)</text></svg>
