<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" aria-labelledby="title desc"><title id="title">SWAP from three CNOTs</title><desc id="desc">The three CNOTs alternate direction. Each holds on every basis state, so by linearity the circuit exchanges any two-qubit state. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">SWAP from three CNOTs</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">Three CNOTs</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 110L240.0 180"/><circle cx="240.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="240.0" cy="180" r="14"/><path class="wire" d="M226.0 180L254.0 180"/><path class="wire" d="M240.0 166L240.0 194"/><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="180" r="5" fill="#476b70"/><circle class="gate" cx="480.0" cy="110" r="14"/><path class="wire" d="M466.0 110L494.0 110"/><path class="wire" d="M480.0 96L480.0 124"/><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="180" r="14"/><path class="wire" d="M706.0 180L734.0 180"/><path class="wire" d="M720.0 166L720.0 194"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket a\ket b\to\ket a\ket{a\oplus b}\to\ket b\ket{a\oplus b}\to\ket b\ket a">|a⟩|b⟩→|a⟩|a⊕ b⟩→|b⟩|a⊕ b⟩→|b⟩|a⟩</text><text x="480" y="357" text-anchor="middle" class="small" data-max-width="700">SWAP</text><text x="150" y="403" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 398L810 398"/><text x="830" y="403" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="473" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 468L810 468"/><text x="830" y="473" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M480 398L480 468"/><path class="wire" d="M472 390L488 406"/><path class="wire" d="M472 406L488 390"/><path class="wire" d="M472 460L488 476"/><path class="wire" d="M472 476L488 460"/><text x="480" y="520" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \(\ket b\ket a\)">Output: |b⟩|a⟩</text></svg>
